<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>F1 Compare</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root { --bg:#0f1626; --panel:#161f33; --line:#26324d; --text:#e6eaf2; --muted:#8e9ab3; --accent:#5b7bd5; --f1:#e06060; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; }
.wrap { min-height:100%; display:flex; align-items:center; justify-content:center; padding:16px; }
form { width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line);
  border-radius:12px; padding:28px 24px; }
.bar { width:36px; height:4px; background:var(--f1); border-radius:2px; margin-bottom:18px; }
h1 { font-size:20px; margin:0 0 6px; letter-spacing:.02em; }
p { margin:0 0 20px; color:var(--muted); font-size:14px; }
input[type=password] { width:100%; padding:12px 14px; font-size:16px; font-family:inherit; color:var(--text);
  background:var(--bg); border:1px solid var(--line); border-radius:10px; outline:none; }
input[type=password]:focus { border-color:var(--accent); }
label { display:flex; gap:8px; align-items:center; margin:14px 0 18px; font-size:13px; color:var(--muted); }
button { width:100%; padding:12px; font-size:15px; font-weight:700; color:#fff; background:var(--accent); font-family:inherit;
  border:0; border-radius:10px; cursor:pointer; }
button:disabled { opacity:.6; cursor:wait; }
.err { min-height:20px; margin-top:12px; font-size:13px; color:#ff6b6b; }
</style>
</head>
<body>
<div class="wrap">
  <form id="f" autocomplete="off">
    <div class="bar"></div>
    <h1>F1 Compare</h1>
    <p>비밀번호를 입력하세요.</p>
    <input id="pw" type="password" placeholder="비밀번호" autofocus required>
    <label><input id="remember" type="checkbox"> 이 기기에서 기억하기</label>
    <button id="go" type="submit">열기</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
(() => {
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const toB64 = (u8) => btoa(String.fromCharCode(...u8));
let META = null, STORE = null;

async function meta() {
  if (!META) {
    META = await (await fetch("key.json", { cache: "no-cache" })).json();
    STORE = "f1compare.key." + META.salt.slice(0, 8);
  }
  return META;
}
async function deriveKey(pw) {
  const m = await meta();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(m.salt), iterations: m.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
// 파일 = iv(12) + AES-GCM 암호문. 평문은 raw deflate 압축
async function decryptBytes(key, buf, compressed = true) {
  const u8 = new Uint8Array(buf);
  let plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8.slice(0, 12) }, key, u8.slice(12));
  if (compressed) plain = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
  return plain;
}
async function checkKey(key) {
  const c = b64((await meta()).check);
  await crypto.subtle.decrypt({ name: "AES-GCM", iv: c.slice(0, 12) }, key, c.slice(12));  // 틀리면 throw
}
async function openSite(key) {
  await checkKey(key);
  const res = await fetch("app.bin", { cache: "no-cache" });
  const html = new TextDecoder().decode(await decryptBytes(key, await res.arrayBuffer()));
  // 앱이 GP 파일·목록을 열 때 쓰는 도우미. document.open 뒤에도 window 는 유지된다
  window.F1SITE = {
    salt: META.salt,
    async fetchText(path) {
      const r = await fetch(path, { cache: "no-cache" });
      if (!r.ok) throw new Error(path + " " + r.status);
      return new TextDecoder().decode(await decryptBytes(key, await r.arrayBuffer()));
    },
    async fetchJson(path) { return JSON.parse(await this.fetchText(path)); },
    forget() { try { localStorage.removeItem(STORE); } catch (e) {} },
  };
  // 파싱 중에 document.open 을 부르면 무시되고 내용이 덧붙으므로 로드 완료 후에 교체
  if (document.readyState !== "complete") await new Promise((r) => addEventListener("load", r, { once: true }));
  document.open(); document.write(html); document.close();
}

(async () => {
  let saved = null;
  try { await meta(); saved = localStorage.getItem(STORE); } catch (e) {}
  if (!saved) return;
  try {
    await openSite(await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]));
  } catch (e) { try { localStorage.removeItem(STORE); } catch (_) {} }
})();

document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "확인 중…"; err.textContent = "";
  let key;
  try {
    key = await deriveKey(document.getElementById("pw").value);
    await checkKey(key);
  } catch (e) {
    err.textContent = "비밀번호가 맞지 않아요.";
    btn.disabled = false; btn.textContent = "열기";
    return;
  }
  if (document.getElementById("remember").checked) {
    try { localStorage.setItem(STORE, toB64(new Uint8Array(await crypto.subtle.exportKey("raw", key)))); } catch (e) {}
  }
  try {
    btn.textContent = "여는 중…";
    await openSite(key);
  } catch (e) {
    err.textContent = "사이트를 열지 못했어요. 새로고침 후 다시 시도해 주세요.";
    btn.disabled = false; btn.textContent = "열기";
  }
});
})();
</script>
</body>
</html>
