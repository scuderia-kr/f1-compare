<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>41.053</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 비밀번호 화면 (평문 공개 파일이라 사이트 내용은 담지 않는다) — 제목·배경은 고정, 드라이버 사진만 무작위 */
:root { --ink:#eef1f5; --muted:#a3acba; --faint:#6b7585; --red:#ff6b5e; }
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; color:var(--ink); overflow-x:hidden;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; -webkit-font-smoothing:antialiased; }
/* 배경: 위쪽이 살짝 밝은 남색 → 아래 검정, 가장자리 어둡게 + 아주 옅은 질감 */
body { background:#04080c; }
.bg { position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(110% 30% at 50% -6%, rgba(40,62,84,.5) 0%, rgba(14,24,34,.2) 55%, transparent 100%),
    radial-gradient(140% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.6) 100%),
    linear-gradient(180deg, #0c151e 0%, #070d13 20%, #060b10 45%, #04080c 100%); }
.bg::after { content:""; position:absolute; inset:0; opacity:.22; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .6  0 0 0 0 .7  0 0 0 0 .8  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

.stage { position:relative; z-index:1; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; align-items:center;
  padding:clamp(28px, 5vh, 56px) 16px clamp(20px, 4vh, 40px); animation:in 1s ease both; }
@keyframes in { from { opacity:0; } to { opacity:1; } }
/* 글자 비율은 원본처럼: 위 작은 제목 ≈ 숫자 크기의 12% */
/* 41.053 은 원본 로고 그림 그대로 (전용 서체·금속 질감·기울기). 위 제목 크기는 원본 비율(로고 폭의 약 3%) */
.stage { --nw:clamp(280px, min(84vw, 57vh), 760px);   /* 41.053 로고 폭 */
  --pw:calc(var(--nw) / .738); }                      /* 사진 폭: 원본처럼 로고가 사진 폭의 73.8% → 확대 없음 */
.for { margin:0; font-size:max(.625rem, calc(var(--nw) * .0295)); font-weight:500; letter-spacing:.62em; padding-left:.62em; color:#dfe4ea; white-space:nowrap; }
.num { display:block; width:var(--nw); height:auto; margin:calc(var(--nw) * .018) 0 0; }

/* 드라이버 사진: 모든 사진은 헬멧 꼭대기가 같은 위치(위에서 60/800), 아래 끝은 사진마다 미리 투명하게 녹여 둠가 되게 잘라 둠 → 41.053 과의 간격이 항상 같다 */
/* 남는 세로 공간을 사진에 준다 (PC 에서도 크게), 폭은 화면을 넘지 않게 */
.driver { position:relative; flex:none; width:var(--pw); height:calc(var(--pw) * 800 / 1122); margin-top:calc(var(--pw) * .014); }
.driver img { display:block; width:100%; height:100%; object-fit:fill; opacity:0; transition:opacity .8s;
  -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 9%, #000 100%), linear-gradient(90deg, transparent 0, #000 24%, #000 76%, transparent 100%);
  -webkit-mask-composite:source-in; mask-image:linear-gradient(180deg, transparent 0, #000 9%, #000 100%), linear-gradient(90deg, transparent 0, #000 24%, #000 76%, transparent 100%); mask-composite:intersect; }
@media (max-aspect-ratio: 1/1) { .driver img { -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 9%, #000 100%), linear-gradient(90deg, transparent 0, #000 8%, #000 92%, transparent 100%);
  mask-image:linear-gradient(180deg, transparent 0, #000 9%, #000 100%), linear-gradient(90deg, transparent 0, #000 8%, #000 92%, transparent 100%); } }
.driver img.on { opacity:1; }

/* 유리 카드 */
/* 카드 폭만 원본 시안 비율(사진 폭의 62.8%)로. 안의 글자·입력칸·버튼 크기는 그대로 */
.card { position:relative; z-index:2; width:clamp(300px, calc(var(--pw) * .628), 100%); margin-top:calc(var(--pw) * -.06); padding:clamp(18px, 3vh, 28px) clamp(16px, 3.4vw, 34px) clamp(18px, 3vh, 28px);
  border-radius:22px; background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.025)); border:1px solid rgba(255,255,255,.13);
  -webkit-backdrop-filter:blur(16px) saturate(1.15); backdrop-filter:blur(16px) saturate(1.15);
  box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08); text-align:center; }
.ask { margin:0 0 clamp(14px, 2.2vh, 20px); font-size:.9375rem; font-weight:500; letter-spacing:.42em; padding-left:.42em; color:#e8ecf1; }
.pill { position:relative; display:flex; align-items:center; height:clamp(56px, 7.2vh, 66px); border-radius:999px; padding:0 6px 0 22px;
  border:1.5px solid rgba(235,240,246,.45); background:rgba(8,12,18,.28); box-shadow:inset 0 1px 0 rgba(255,255,255,.06); transition:border-color .2s, box-shadow .2s; }
.pill:focus-within { border-color:rgba(255,255,255,.8); box-shadow:0 0 0 4px rgba(255,255,255,.06), inset 0 1px 0 rgba(255,255,255,.08); }
.pill svg.lock { flex:none; width:20px; height:20px; color:#d9dee5; opacity:.9; }
.pill input { flex:1; min-width:0; height:100%; padding:0 14px 0 18px; border:0; background:transparent; outline:none; color:#fff;
  font:inherit; font-size:1.0625rem; letter-spacing:.28em; caret-color:#fff; }
.pill input::placeholder { color:rgba(225,231,238,.62); letter-spacing:.18em; }
.pill .div { flex:none; width:1px; height:46%; background:rgba(235,240,246,.3); margin-right:10px; }
.go { flex:none; width:clamp(44px, 5.8vh, 52px); height:clamp(44px, 5.8vh, 52px); border-radius:50%; cursor:pointer; padding:0; display:grid; place-items:center; color:#fff;
  border:1px solid rgba(255,255,255,.28); background:radial-gradient(120% 120% at 30% 20%, #6b7178 0%, #3a3f46 45%, #1c2026 100%);
  box-shadow:0 4px 12px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.18); transition:transform .15s, filter .15s; }
.go:hover { filter:brightness(1.15); } .go:active { transform:scale(.95); }
.go svg { width:20px; height:20px; }
.go:disabled { opacity:.5; cursor:wait; }
.row2 { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; min-height:1.3em; }
.row2 label { display:flex; align-items:center; gap:7px; font-size:.75rem; color:var(--faint); letter-spacing:.03em; cursor:pointer; }
.row2 label input { accent-color:#c8cfd8; margin:0; }
.err { font-size:.8125rem; color:var(--muted); letter-spacing:.03em; }
.err.bad { color:var(--red); }
.shake { animation:shake .35s; }
@keyframes shake { 20%,60% { transform:translateX(-7px); } 40%,80% { transform:translateX(7px); } }
@media (max-width: 600px) {
  .stage { justify-content:center; }   /* 남는 세로 공간은 위아래로 나눔 */
  /* 휴대폰: 입력 카드를 작게 (사진이 주인공) */
  .card { width:min(340px, 92%); padding:14px 14px 10px; border-radius:18px; }
  .ask { font-size:.6875rem; letter-spacing:.38em; padding-left:.38em; margin-bottom:10px; }
  .pill { height:46px; padding:0 4px 0 14px; border-width:1px; }
  .pill svg.lock { width:16px; height:16px; }
  .pill input { font-size:16px; padding:0 10px 0 10px; letter-spacing:.2em; }
  .pill .div { margin-right:6px; }
  .go { width:36px; height:36px; } .go svg { width:16px; height:16px; }
  .row2 { margin-top:6px; } .row2 label { font-size:.6875rem; }
}
@media (max-width: 480px) { .row2 { flex-direction:column-reverse; gap:4px; } }
@media (prefers-reduced-motion: reduce) { .stage, .shake { animation:none; } .driver img { transition:none; } }
/* 입력 카드 최종 크기 (시안 C). 앞의 카드 규칙을 덮어쓴다 */
.card { width:min(300px, 92vw); padding:13px 16px 9px; border-radius:16px; }
.ask { font-size:11px; margin-bottom:10px; letter-spacing:.4em; padding-left:.4em; }
.pill { height:40px; padding:0 3px 0 12px; border-width:1.2px; }
.pill svg.lock { width:15px; height:15px; }
.pill input { font-size:13px; padding:0 8px 0 9px; letter-spacing:.2em; }
.pill .div { margin-right:5px; }
.go { width:32px; height:32px; } .go svg { width:14px; height:14px; }
.row2 { margin-top:6px; min-height:0; flex-direction:row; gap:6px; }
.row2 label, .err { font-size:10.5px; }
.row2 label input { width:11px; height:11px; }
/* 휴대폰: 한 단계 더 작게 */
@media (max-width: 600px) {
  .card { width:min(256px, 86vw); padding:10px 12px 7px; border-radius:14px; }
  .ask { font-size:9.5px; margin-bottom:8px; }
  .pill { height:34px; padding:0 3px 0 10px; border-width:1px; }
  .pill svg.lock { width:12px; height:12px; }
  .pill input { font-size:11.5px; padding:0 6px 0 7px; letter-spacing:.18em; }
  .go { width:27px; height:27px; } .go svg { width:12px; height:12px; }
  .row2 { margin-top:5px; flex-direction:column-reverse; gap:2px; }
  .row2 label, .err { font-size:9.5px; }
  .row2 label input { width:10px; height:10px; }
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main class="stage">
  <p class="for">FOR SCUDERIA FERRARI</p>
  <img class="num" src="gate/num.webp" alt="41.053" width="874" height="204">
  <div class="driver"><img id="drv" alt="" style="object-position:50% 0"></div>
  <form class="card" id="f" autocomplete="off">
    <p class="ask">ENTER PASSCODE</p>
    <div class="pill" id="pill">
      <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
      <input id="pw" type="password" placeholder="Passcode" aria-label="비밀번호">
      <span class="div"></span>
      <button class="go" id="go" type="submit" aria-label="열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <div class="row2"><label><input id="remember" type="checkbox"> 이 기기에서 기억하기</label><span class="err" id="err" role="status"></span></div>
  </form>
</main>
<script>
// 드라이버 사진: 매번 완전히 무작위 (암호학적 난수, 7장 균등 확률, 이전 기록과 무관)
(() => {
  const N = 7, img = document.getElementById("drv");
  const forced = +new URLSearchParams(location.search).get("i");
  const r = new Uint32Array(1); crypto.getRandomValues(r);
  const i = forced >= 1 && forced <= N ? forced : 1 + (r[0] % N);
  img.onload = () => img.classList.add("on");
  img.src = `gate/driver${i}.webp`;
})();
(() => {
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const toB64 = (u8) => btoa(String.fromCharCode(...u8));
let META = null, STORE = null;

async function meta() {
  if (!META) {
    META = await (await fetch("key.json", { cache: "no-cache" })).json();
    STORE = "f1compare.key." + META.salt.slice(0, 8);
  }
  return META;
}
async function deriveKey(pw) {
  const m = await meta();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(m.salt), iterations: m.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
// 파일 = iv(12) + AES-GCM 암호문. 평문은 raw deflate 압축
async function decryptBytes(key, buf, compressed = true) {
  const u8 = new Uint8Array(buf);
  let plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8.slice(0, 12) }, key, u8.slice(12));
  if (compressed) plain = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
  return plain;
}
async function checkKey(key) {
  const c = b64((await meta()).check);
  await crypto.subtle.decrypt({ name: "AES-GCM", iv: c.slice(0, 12) }, key, c.slice(12));  // 틀리면 throw
}
async function openSite(key) {
  await checkKey(key);
  const res = await fetch("app.bin", { cache: "no-cache" });
  const html = new TextDecoder().decode(await decryptBytes(key, await res.arrayBuffer()));
  // 앱이 GP 파일·목록을 열 때 쓰는 도우미. document.open 뒤에도 window 는 유지된다
  window.F1SITE = {
    salt: META.salt,
    async fetchText(path) {
      const r = await fetch(path, { cache: "no-cache" });
      if (!r.ok) throw new Error(path + " " + r.status);
      return new TextDecoder().decode(await decryptBytes(key, await r.arrayBuffer()));
    },
    async fetchJson(path) { return JSON.parse(await this.fetchText(path)); },
    forget() { try { localStorage.removeItem(STORE); } catch (e) {} },
  };
  // 파싱 중에 document.open 을 부르면 무시되고 내용이 덧붙으므로 로드 완료 후에 교체
  if (document.readyState !== "complete") await new Promise((r) => addEventListener("load", r, { once: true }));
  document.open(); document.write(html); document.close();
}

(async () => {
  let saved = null;
  try { await meta(); saved = localStorage.getItem(STORE); } catch (e) {}
  if (!saved) return;
  try {
    await openSite(await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]));
  } catch (e) { try { localStorage.removeItem(STORE); } catch (_) {} }
})();

document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; err.className = "err"; err.textContent = "확인 중…";
  let key;
  try {
    key = await deriveKey(document.getElementById("pw").value);
    await checkKey(key);
  } catch (e) {
    err.className = "err bad"; err.textContent = "비밀번호가 맞지 않아요.";
    btn.disabled = false;
    const fld = document.getElementById("pill"); fld.classList.remove("shake"); void fld.offsetWidth; fld.classList.add("shake");
    document.getElementById("pw").select();
    return;
  }
  if (document.getElementById("remember").checked) {
    try { localStorage.setItem(STORE, toB64(new Uint8Array(await crypto.subtle.exportKey("raw", key)))); } catch (e) {}
  }
  try {
    err.textContent = "여는 중…";
    await openSite(key);
  } catch (e) {
    err.className = "err bad"; err.textContent = "사이트를 열지 못했어요. 새로고침 후 다시 시도해 주세요.";
    btn.disabled = false;
  }
});
})();
</script>
</body>
</html>
