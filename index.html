<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>F1 Compare</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 비밀번호 화면: 우주 · 지구 (평문 공개 파일이라 사이트 내용은 담지 않는다) */
:root { --ink:#e8ecf2; --muted:#9aa4b6; --faint:#5f6b85; --blue:#8fb8ff; --red:#ff7a66; }
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; background:#000; color:var(--ink); overflow-x:hidden;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; -webkit-font-smoothing:antialiased; }
#stars { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
.stage { position:relative; z-index:1; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:max(24px, 5vh) 16px max(20px, 4vh); animation:in 1.2s ease both; }
@keyframes in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
.title { margin:0; font-size:clamp(.875rem, 2.1vh, 1.25rem); font-weight:500; letter-spacing:.42em; padding-left:.42em; text-transform:uppercase; }
.code { margin:clamp(10px, 2vh, 22px) 0 0; font-size:clamp(1.625rem, 4vh, 2.5rem); font-weight:700; letter-spacing:.22em; padding-left:.22em; font-variant-numeric:tabular-nums; }
.globe { position:relative; width:min(100vw, 64vh, 780px); aspect-ratio:941 / 860; margin:clamp(8px, 2.5vh, 30px) 0; }
.globe img { position:relative; z-index:1; display:block; width:100%; height:100%;
  -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%, #000 86%, transparent 100%); mask-image:radial-gradient(ellipse 50% 50% at 50% 50%, #000 86%, transparent 100%); }
/* 지구를 가로지르는 빛줄기: 이미지 밖 화면 끝까지 이어 준다 */
.horizon { position:absolute; z-index:2; top:50.12%; left:50%; width:100vw; height:2px; margin-top:-1px; transform:translateX(-50%); pointer-events:none;
  background:linear-gradient(90deg, transparent 0%, rgba(255,122,102,.55) 12%, rgba(255,150,130,.95) 30%, rgba(200,190,220,.6) 50%, rgba(143,184,255,.95) 70%, rgba(143,184,255,.55) 88%, transparent 100%);
  box-shadow:0 0 6px rgba(255,140,120,.45), 0 0 14px rgba(143,184,255,.35); }
form { display:flex; flex-direction:column; align-items:center; width:100%; }
.ask { margin:0; font-size:clamp(.875rem, 2.1vh, 1.25rem); font-weight:500; letter-spacing:.48em; padding-left:.48em; color:#cfd5de; }
.field { position:relative; width:min(300px, 74vw); margin-top:clamp(14px, 2.6vh, 26px); }
input[type=password] { width:100%; padding:10px 40px 10px 40px; background:transparent; border:0; border-bottom:1px solid rgba(190,205,235,.35); border-radius:0;
  color:#fff; font:inherit; font-size:1.375rem; letter-spacing:.45em; text-align:center; outline:none; caret-color:var(--blue); transition:border-color .2s, box-shadow .2s; }
input[type=password]::placeholder { color:rgba(190,205,235,.28); letter-spacing:.3em; font-size:1rem; }
input[type=password]:focus { border-bottom-color:var(--blue); box-shadow:0 10px 18px -14px rgba(143,184,255,.9); }
.go { position:absolute; right:2px; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:50%; border:1px solid rgba(190,205,235,.3);
  background:transparent; color:var(--ink); font-size:1rem; cursor:pointer; display:grid; place-items:center; padding:0; }
.go:hover { border-color:var(--blue); color:#fff; }
.go:disabled { opacity:.4; cursor:wait; }
label { display:flex; gap:8px; align-items:center; margin-top:16px; font-size:.75rem; color:var(--faint); letter-spacing:.04em; cursor:pointer; }
label input { accent-color:#5b7bd5; margin:0; }
.err { min-height:1.2em; margin-top:10px; font-size:.8125rem; color:var(--muted); letter-spacing:.04em; text-align:center; }
.err.bad { color:var(--red); }
.shake { animation:shake .35s; }
@keyframes shake { 20%,60% { transform:translateX(-6px); } 40%,80% { transform:translateX(6px); } }
@media (prefers-reduced-motion: reduce) { .stage, .shake { animation:none; } }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<main class="stage">
  <h1 class="title">Access Village</h1>
  <div class="code">41.053</div>
  <div class="globe"><div class="horizon"></div><img src="earth.webp" alt="" width="941" height="860"></div>
  <form id="f" autocomplete="off">
    <p class="ask">ENTER PASSCODE</p>
    <div class="field">
      <input id="pw" type="password" placeholder="••••" aria-label="비밀번호" autofocus required>
      <button id="go" class="go" type="submit" aria-label="열기">→</button>
    </div>
    <label><input id="remember" type="checkbox"> 이 기기에서 기억하기</label>
    <div class="err" id="err" role="status"></div>
  </form>
</main>
<script>
(() => {
  const cv = document.getElementById("stars"), ctx = cv.getContext("2d");
  function draw() {
    const dpr = Math.min(2, devicePixelRatio || 1), w = innerWidth, h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const n = Math.round(w * h / 2600);
    for (let i = 0; i < n; i++) {
      const x = rnd() * w, y = rnd() * h, r = rnd() ** 3 * 1.3 + 0.25, a = 0.25 + rnd() * 0.75, blue = rnd() < 0.35;
      ctx.fillStyle = blue ? `rgba(190,210,255,${a})` : `rgba(255,255,255,${a})`;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      if (r > 1.25) {   // 밝은 별은 십자 빛
        const g = ctx.createRadialGradient(x, y, 0, x, y, r * 6); g.addColorStop(0, `rgba(220,230,255,${a * 0.5})`); g.addColorStop(1, "rgba(220,230,255,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = `rgba(230,238,255,${a * 0.6})`; ctx.lineWidth = 0.6; ctx.beginPath();
        ctx.moveTo(x - r * 5, y); ctx.lineTo(x + r * 5, y); ctx.moveTo(x, y - r * 5); ctx.lineTo(x, y + r * 5); ctx.stroke();
      }
    }
  }
  draw(); let t = null; addEventListener("resize", () => { clearTimeout(t); t = setTimeout(draw, 150); });
})();
(() => {
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const toB64 = (u8) => btoa(String.fromCharCode(...u8));
let META = null, STORE = null;

async function meta() {
  if (!META) {
    META = await (await fetch("key.json", { cache: "no-cache" })).json();
    STORE = "f1compare.key." + META.salt.slice(0, 8);
  }
  return META;
}
async function deriveKey(pw) {
  const m = await meta();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(m.salt), iterations: m.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
// 파일 = iv(12) + AES-GCM 암호문. 평문은 raw deflate 압축
async function decryptBytes(key, buf, compressed = true) {
  const u8 = new Uint8Array(buf);
  let plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8.slice(0, 12) }, key, u8.slice(12));
  if (compressed) plain = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
  return plain;
}
async function checkKey(key) {
  const c = b64((await meta()).check);
  await crypto.subtle.decrypt({ name: "AES-GCM", iv: c.slice(0, 12) }, key, c.slice(12));  // 틀리면 throw
}
async function openSite(key) {
  await checkKey(key);
  const res = await fetch("app.bin", { cache: "no-cache" });
  const html = new TextDecoder().decode(await decryptBytes(key, await res.arrayBuffer()));
  // 앱이 GP 파일·목록을 열 때 쓰는 도우미. document.open 뒤에도 window 는 유지된다
  window.F1SITE = {
    salt: META.salt,
    async fetchText(path) {
      const r = await fetch(path, { cache: "no-cache" });
      if (!r.ok) throw new Error(path + " " + r.status);
      return new TextDecoder().decode(await decryptBytes(key, await r.arrayBuffer()));
    },
    async fetchJson(path) { return JSON.parse(await this.fetchText(path)); },
    forget() { try { localStorage.removeItem(STORE); } catch (e) {} },
  };
  // 파싱 중에 document.open 을 부르면 무시되고 내용이 덧붙으므로 로드 완료 후에 교체
  if (document.readyState !== "complete") await new Promise((r) => addEventListener("load", r, { once: true }));
  document.open(); document.write(html); document.close();
}

(async () => {
  let saved = null;
  try { await meta(); saved = localStorage.getItem(STORE); } catch (e) {}
  if (!saved) return;
  try {
    await openSite(await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]));
  } catch (e) { try { localStorage.removeItem(STORE); } catch (_) {} }
})();

document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; err.className = "err"; err.textContent = "확인 중…";
  let key;
  try {
    key = await deriveKey(document.getElementById("pw").value);
    await checkKey(key);
  } catch (e) {
    err.className = "err bad"; err.textContent = "비밀번호가 맞지 않아요.";
    btn.disabled = false;
    const fld = document.querySelector(".field"); fld.classList.remove("shake"); void fld.offsetWidth; fld.classList.add("shake");
    document.getElementById("pw").select();
    return;
  }
  if (document.getElementById("remember").checked) {
    try { localStorage.setItem(STORE, toB64(new Uint8Array(await crypto.subtle.exportKey("raw", key)))); } catch (e) {}
  }
  try {
    err.textContent = "여는 중…";
    await openSite(key);
  } catch (e) {
    err.className = "err bad"; err.textContent = "사이트를 열지 못했어요. 새로고침 후 다시 시도해 주세요.";
    btn.disabled = false;
  }
});
})();
</script>
</body>
</html>
